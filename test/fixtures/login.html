<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guard sign-in</title>
    <style>
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        z-index: 99;
        padding: 2rem;
      }
      #echo {
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>Guard sign-in</h1>

    <!--
      THE FIXTURE IS THE WITNESS, AND IT REPORTS BOOLEANS ONLY.

      Every guard in bench/guards.mjs G16-G28 is checked against THIS page's own
      record of what happened to it, never against Aperture's report of itself.
      That rule is the whole reason bench/guards.mjs exists.

      Nothing here ever prints a secret. Two independent reasons, and both
      matter:

        1. A fixture that printed the password would be redacted by the very
           needle mechanism G19 exists to test, so the guard would be reading
           its own mitigation and would pass whether or not the fill worked.
        2. The expected password and the TOTP seed are embedded in this page's
           SCRIPT, which browser_read strips and the walker never serialises.
           They stay there; only booleans reach the log line.

      The one-time code is computed HERE, from the seed, with this page's own
      WebCrypto. `otp-valid:true` therefore means "the digits Aperture inserted
      are the digits this page independently derived" — not "Aperture agreed
      with Aperture".
    -->

    <p id="vaultlog">vault-log: (not rendered)</p>
    <div id="echo"></div>

    <!--
      THE HREF SINK.

      `redactTainted` scrubbed `value`, `text`, `name` and `rows` and not
      `href`, which the renderer emits on every full snapshot AND in a diff. An
      independent review measured the escape on this exact shape:

          link e7 "Continue to checkout" /leak?pw=guard-pw-93a1

      A link's target is the cheapest thing a late-injected skimmer can write —
      it needs no network of its own — so this is the sink that mattered most
      for the one adversary needles exist against. The echo button below writes
      the password into it; G19b asserts it does not come back, and G19's
      whole-snapshot check fails on it too.
    -->
    <p><a id="leaklink" href="/checkout">Continue to checkout</a></p>

    <form id="signin">
      <p>
        <label for="u">Email or username</label>
        <input id="u" name="username" type="text" autocomplete="username" />
      </p>
      <p id="pwrow">
        <label for="p">Password</label>
        <input id="p" name="password" type="password" autocomplete="current-password" />
      </p>
      <p id="otprow">
        <label for="o">Verification code</label>
        <input id="o" name="otp" type="text" autocomplete="one-time-code" inputmode="numeric" />
      </p>
      <!--
        The visible decoy. A plain text input the walker DOES serialise the
        value of, sitting immediately after the password field so that any
        focus-following keystroke path which loses focus mid-word deposits the
        tail of the secret here. `visible-decoy-set:false` is the assertion that
        the write was aimed by element identity and not by focus
        (docs/design/vaultfill.md section 3.1).

        Its label must match no username, OTP or profile pattern, or the plan
        would legitimately target it and the guard would measure nothing.
      -->
      <p>
        <label for="d">Search this site</label>
        <input id="d" name="decoy" type="text" />
      </p>
      <p><button type="submit" id="go">Sign in</button></p>
    </form>

    <p>
      <button type="button" id="echobtn">Echo password to page</button>
      <button type="button" id="showbtn">Show password</button>
      <button type="button" id="rmbtn">Remove password field</button>
      <button type="button" id="armbtn">Arm page change</button>
    </p>

    <!--
      THE SINKS THE PER-TAB, RAW-BYTES SCRUB DID NOT REACH (2026-08-05, gate 2).

      Three constructions, each of which defeated the whole needle mechanism on
      the build that closed the five sinks above. They are grouped here because
      they share one root cause in two halves: the scrub has to see the bytes
      the model sees (the SPLIT button), and it has to be in scope wherever the
      page can put those bytes (the two carriers and the navigation).

      Still no secret is printed as text by this fixture. Every button writes
      the value Aperture handed this origin into a place the agent reads, and
      the guard asserts it does not come back.
    -->
    <p>
      <button type="button" id="splitbtn">Split password into page</button>
      <button type="button" id="popbtn">Open carrier tab</button>
      <button type="button" id="foreignbtn">Open foreign carrier tab</button>
      <button type="button" id="gobtn">Navigate away carrying the value</button>
    </p>
    <div id="splitextra"></div>

    <script>
      (() => {
        const q = new URLSearchParams(location.search);
        const mode = q.get('mode') || 'default';

        // Known to this page only. Never rendered, never logged.
        const EXPECT_USER = 'guard@example.com';
        const EXPECT_PW = 'guard-pw-93a1';
        const TOTP_SEED = 'JBSWY3DPEHPK3PXP';

        const form = document.getElementById('signin');
        const u = document.getElementById('u');
        const p = document.getElementById('p');
        const o = document.getElementById('o');
        const d = document.getElementById('d');
        const pwrow = document.getElementById('pwrow');
        const otprow = document.getElementById('otprow');
        const log = document.getElementById('vaultlog');
        const echo = document.getElementById('echo');
        const leaklink = document.getElementById('leaklink');

        // Page shapes. Each guard loads the shape it needs; nothing here is
        // toggled by Aperture, so a mis-shaped page is a visible setup error
        // rather than a silent pass.
        if (mode !== 'otp') otprow.remove();
        if (mode === 'otp') pwrow.remove();
        if (mode === 'readonly') p.readOnly = true;
        if (mode === 'fieldset') {
          // Disabled by an ANCESTOR, which is the case `input.disabled` cannot
          // see: the IDL property reflects the content attribute only, so it
          // reads `false` here while the control is unusable to a human.
          const fs = document.createElement('fieldset');
          fs.disabled = true;
          pwrow.parentNode.insertBefore(fs, pwrow);
          fs.appendChild(pwrow);
        }
        if (mode === 'overlay') {
          const ov = document.createElement('div');
          ov.id = 'overlay';
          ov.setAttribute('role', 'dialog');
          ov.setAttribute('aria-modal', 'true');
          ov.textContent = 'We use cookies.';
          document.body.appendChild(ov);
        }

        // THE INTERLEAVING. The write pass's own event turns, weaponised.
        //
        // Aperture writes username → password → otp in one task, and every step
        // of it runs page JavaScript synchronously: `focus()` fires
        // focus/focusin, and the dispatched `input`/`change` fire theirs. So the
        // username's handlers ALWAYS get to run before the password is written,
        // and at c375415 a handler that did `p.type = 'text'` there got the
        // saved password written into a plain-text field while Aperture
        // answered `filled username and password …`.
        //
        // This is not the same window G22 measures. G22 unmasks while the
        // CONSENT DIALOG is open, which the validation pass catches; this
        // unmasks 200ms later, after validation has already passed. The guard
        // is G22b.
        if (mode === 'race') {
          const flip = () => {
            if (p) p.type = 'text';
            render();
          };
          u.addEventListener('focus', flip);
          u.addEventListener('input', flip);
          u.addEventListener('change', flip);
        }

        // The snap-back field: a controlled component that rejects the write on
        // its next turn of the loop. `setTimeout(0)` rather than a synchronous
        // clear on purpose — a synchronous revert is caught by the same-task
        // read-back, and G18b is about the DEFERRED T+250ms check.
        if (mode === 'snapback') {
          p.addEventListener('input', () => {
            setTimeout(() => {
              p.value = '';
              render();
            }, 60);
          });
        }

        let submits = 0;
        let submittedMatch = false;
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          submits += 1;
          const fd = new FormData(form);
          submittedMatch =
            fd.get('password') === EXPECT_PW && fd.get('username') === EXPECT_USER;
          render();
        });

        document.getElementById('echobtn').addEventListener('click', () => {
          // The exfiltration shape G19 is about: the page copies the value it
          // legitimately holds into visible text, where a snapshot or a
          // browser_read would otherwise carry it straight into agent context.
          echo.textContent = 'copy ' + (p ? p.value : '') + (o ? ' ' + o.value : '');
          // The SECOND sink, and the one that escaped: a link target. It is not
          // innerText, so browser_read never sees it — only the snapshot line
          // does, which is why the href gets a guard of its own (G19b).
          leaklink.href = '/leak?pw=' + (p ? p.value : '') + (o ? '&c=' + o.value : '');

          // --- the sinks that are NOT on SnapshotNode --------------------------
          //
          // `redactTainted` took a SnapshotNode and walked the node tree. These
          // three are page-controlled strings the agent is shown that no node
          // carries, so the needles never covered them
          // (docs/design/security-review-2026-08.md F1, F2, F3).
          //
          // Nothing here prints a secret as TEXT — the fixture's rule at the
          // top of this file still holds. `document.title` is chrome, the URL
          // is chrome, and a tag name is markup; all three reach agent context
          // through channels that are not the rendered tree, which is exactly
          // why they escaped. Same construction as the href sink above: write
          // the value Aperture just handed this origin into a place the agent
          // reads, and let the guard assert it does not come back.
          const v = p ? p.value : '';

          // Snapshot.title → the `page "…" …` header of every full snapshot,
          // and every `browser_tabs list` line.
          document.title = 'TITLESINK ' + v;

          // Snapshot.url → the same header line, plus browser_tabs, plus
          // browser_navigate's `loaded …`. replaceState is a SAME-DOCUMENT
          // navigation, so `documentReplaced` stays false and invalidate()
          // deliberately keeps the needles armed — the redaction state is
          // fully live and simply did not cover this string.
          history.replaceState(
            null,
            '',
            location.pathname + location.search + '&urlsink=' + v,
          );

          // The element's own TAG NAME, which `browser_act action:"select"`
          // interpolates raw and uncapped into harness prose that sits OUTSIDE
          // the untrusted envelope. A custom element name may hold [a-z0-9._-]
          // and has no length limit, so this is both a needle leak and an
          // injection surface in Aperture's own voice.
          if (!document.getElementById('tagsink')) {
            const custom = document.createElement('x-' + (v || 'none'));
            custom.id = 'tagsink';
            custom.setAttribute('role', 'button');
            custom.textContent = 'Tag sink';
            document.body.appendChild(custom);
          }
          render();
        });
        // --- G19g: ONE INVISIBLE CHARACTER ---------------------------------
        //
        // `redactObserved` ran on the raw walk result and `render.ts` then put
        // every name / value / text / cell and the title through quote() ->
        // sanitize(), which STRIPS U+202A-202E rather than escaping them. So a
        // value split by one of them matched no needle when the scrub ran and
        // was whole again in the text the model received — measured on four
        // fields at once (docs/design/sink-closure-review.md F-B).
        //
        // U+202D is invisible, is not whitespace, and survives the walker's
        // \s+ normalisation, which is what makes it the sharpest separator.
        // The fix is upstream, in walker.ts: the strip happens at WALK time, so
        // the redactor now reads what the renderer will write.
        document.getElementById('splitbtn').addEventListener('click', () => {
          const v = p ? p.value : '';
          const split = v.slice(0, 8) + '‭' + v.slice(8);
          const extra = document.getElementById('splitextra');

          // 1. SnapshotNode.text
          const t = document.createElement('p');
          t.id = 'splittext';
          t.textContent = 'SPLITSINK text ' + split;

          // 2. SnapshotNode.name, via the accessible name
          const b = document.createElement('button');
          b.id = 'splitname';
          b.textContent = 'Split name sink';
          b.setAttribute('aria-label', 'SPLITSINK name ' + split);

          // 3. SnapshotNode.value, on a field Aperture never wrote to — so
          //    this is the needle branch and not the taint branch.
          const inp = document.createElement('input');
          inp.id = 'splitvalue';
          inp.type = 'text';
          inp.setAttribute('aria-label', 'Split value sink');
          inp.value = 'SPLITSINK value ' + split;

          // 4. SnapshotNode.rows, a flattened data table
          const tb = document.createElement('table');
          tb.id = 'splitrows';
          tb.innerHTML = '<tr><td>SPLITSINK cell</td><td></td></tr>';
          tb.querySelectorAll('td')[1].textContent = split;

          // 5. SnapshotNode.href — the field that HELD under the original
          //    probe, because sanitizeHref strips at walk time, and still
          //    disclosed the value: `new URL(...)` runs FIRST and turns the
          //    separator into `%E2%80%AD`, so the strip finds nothing and the
          //    rendered target reads `/leak?pw=guard-pw%E2%80%AD-93a1`. Two
          //    decodings Aperture itself would do, and the password is back.
          const a = document.createElement('a');
          a.id = 'splithref';
          a.textContent = 'Split href sink';
          // The query key carries the SPLITSINK mark so the guard's
          // non-vacuity count sees this sink too — the rendered target is the
          // only place this one shows up, and it has no label of its own.
          a.href = '/leak?SPLITSINK=' + split;

          for (const el of [t, b, inp, tb, a]) {
            if (!document.getElementById(el.id)) extra.appendChild(el);
          }

          // 5. Snapshot.title. TITLESINK is kept in the string so G19c's
          //    non-vacuity check still matches if the order ever changes.
          document.title = 'TITLESINK SPLITSINK ' + split;
          render();
        });

        // --- G19d / G19f / G19i: THE CARRIER TAB ----------------------------
        //
        // window.open makes Aperture CREATE AND ACTIVATE a new tab
        // (src/main/tabs.ts, setWindowOpenHandler). Nothing was ever filled
        // into it, so a per-tab needle store is empty there and every per-tab
        // scrub is a no-op — the agent's next unqualified browser_snapshot
        // returned the whole tree in clear (sink-closure-review.md F-A).
        //
        // Two carriers, because they are closed by two different halves of the
        // fix. The same-origin one is covered by keying needles by ORIGIN. The
        // FOREIGN one is covered only by the opener origin Aperture records
        // when it creates the tab — nothing else knows the value went there.
        document.getElementById('popbtn').addEventListener('click', () => {
          window.open('/carrier.html#' + encodeURIComponent(p ? p.value : ''), '_blank');
        });
        document.getElementById('foreignbtn').addEventListener('click', () => {
          window.open(
            'http://127.0.0.2:8899/carrier.html#' + encodeURIComponent(p ? p.value : ''),
            '_blank',
          );
        });

        // --- G19h: THE NAVIGATION THAT USED TO DROP THE NEEDLES -------------
        //
        // No second tab at all. A real, document-replacing navigation to a
        // same-origin URL carrying the value. `invalidate(tabId, true)` used to
        // call clearNeedles here, so the navigation that DELIVERED the secret
        // was the navigation that disarmed the redaction, and the next snapshot
        // rendered it in clear on the header line, in the tree, in
        // browser_read, and in browser_tabs list.
        document.getElementById('gobtn').addEventListener('click', () => {
          location.href = '/carrier.html#' + encodeURIComponent(p ? p.value : '');
        });

        document.getElementById('showbtn').addEventListener('click', () => {
          if (p) p.type = 'text';
          render();
        });
        document.getElementById('rmbtn').addEventListener('click', () => {
          if (pwrow.isConnected) pwrow.remove();
          render();
        });

        // --- the independent one-time-code witness ---------------------------

        const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        function b32(s) {
          let bits = 0;
          let val = 0;
          const out = [];
          for (const c of s.toUpperCase().replace(/[\s=-]/g, '')) {
            const i = B32.indexOf(c);
            if (i < 0) continue;
            val = (val << 5) | i;
            bits += 5;
            if (bits >= 8) {
              out.push((val >>> (bits - 8)) & 255);
              bits -= 8;
            }
          }
          return new Uint8Array(out);
        }

        async function codeFor(counter) {
          const key = await crypto.subtle.importKey(
            'raw',
            b32(TOTP_SEED),
            { name: 'HMAC', hash: 'SHA-1' },
            false,
            ['sign'],
          );
          const buf = new ArrayBuffer(8);
          const dv = new DataView(buf);
          dv.setUint32(0, Math.floor(counter / 0x100000000));
          dv.setUint32(4, counter >>> 0);
          const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, buf));
          const off = sig[sig.length - 1] & 0x0f;
          const bin =
            ((sig[off] & 0x7f) << 24) |
            ((sig[off + 1] & 0xff) << 16) |
            ((sig[off + 2] & 0xff) << 8) |
            (sig[off + 3] & 0xff);
          return String(bin % 1000000).padStart(6, '0');
        }

        let otpValid = false;
        async function checkOtp() {
          if (!o || !o.isConnected || !o.value) {
            otpValid = false;
            return;
          }
          const now = Math.floor(Date.now() / 1000 / 30);
          // Current window OR the one before it, which is what a real verifier
          // accepts and what keeps this from flaking on a step boundary
          // crossed between generation and this check. Either way the digits
          // are derived here, from the seed, with no help from Aperture.
          const [a, b] = await Promise.all([codeFor(now), codeFor(now - 1)]);
          otpValid = o.value === a || o.value === b;
        }

        // --- the log line ----------------------------------------------------

        function line() {
          return (
            'vault-log: ' +
            [
              'pw-match:' + Boolean(p && p.isConnected && p.value === EXPECT_PW),
              'user-match:' + Boolean(u && u.value === EXPECT_USER),
              'visible-decoy-set:' + Boolean(d && d.value !== ''),
              'otp-valid:' + otpValid,
              'submits:' + submits,
              'submitted-values-match:' + submittedMatch,
              'echoed:' + (echo.textContent.trim() !== ''),
              'pw-masked:' + Boolean(p && p.isConnected && p.type === 'password'),
              'pw-present:' + Boolean(p && p.isConnected),
            ].join(' ')
          );
        }

        let rendering = false;
        function render() {
          log.textContent = line();
          if (rendering) return;
          rendering = true;
          checkOtp()
            .catch(() => {
              otpValid = false;
            })
            .then(() => {
              rendering = false;
              log.textContent = line();
            });
        }

        // Rendered on every event the fill path itself dispatches, so the log
        // is current the moment the write lands. No polling: a page that
        // rewrote itself on a timer would be a live region, and the diff
        // engine's volatility tracker would start suppressing it.
        for (const el of [u, p, o, d]) {
          if (!el) continue;
          el.addEventListener('input', render);
          el.addEventListener('change', render);
        }

        // --- the page moving WHILE the human looks at the consent dialog -----
        //
        // Three guards (G20, G21, G22) need a change that lands strictly INSIDE
        // the window between Aperture resolving the chosen fields (pipeline
        // step 7) and the preload receiving the write (step 12). That window is
        // the consent dialog, held open by --e2e-consent-delay-ms.
        //
        // The URL parameter says WHAT changes and after how long. The ARM
        // BUTTON says when the clock starts, and the button is the reason this
        // is not a race: timing the change from page LOAD would have to beat
        // the navigation settle, the snapshot, the plan and the resolve, none
        // of which have a fixed duration. Timed from a click the guard issues
        // immediately before `apply`, the only variable left is the pipeline's
        // own first few hundred milliseconds.
        //
        // A change that arrives too EARLY is not a silent pass, which is what
        // makes this safe to get slightly wrong: the plan then refuses with
        // NO_FIELDS (or step 4 refuses ORIGIN_MISMATCH), and the guard fails
        // loudly on a code it did not expect.
        const at = (name) => {
          const v = Number(q.get(name));
          return Number.isFinite(v) && v > 0 ? v : null;
        };
        const armButton = document.getElementById('armbtn');
        armButton.addEventListener('click', () => {
          const navAt = at('nav');
          if (navAt) {
            setTimeout(() => {
              // A DIFFERENT ORIGIN, same server: 127.0.0.1 and localhost are
              // distinct origins and distinct registrable domains, so this is a
              // real cross-origin commit and not a same-document trick.
              location.href =
                'http://localhost:8899/login.html?arrived=1&t=' + Date.now();
            }, navAt);
          }
          const rmAt = at('remove');
          if (rmAt) setTimeout(() => { pwrow.remove(); render(); }, rmAt);
          const showAt = at('showpw');
          if (showAt) setTimeout(() => { if (p) p.type = 'text'; render(); }, showAt);
        });

        render();
      })();
    </script>
  </body>
</html>
